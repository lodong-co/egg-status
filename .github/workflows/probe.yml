name: probe

# schedule 의 역할이 바뀌었다.
#
# 전에는 이 cron 이 곧 측정 주기였다. 그런데 10분으로 걸어 놔도 실제 간격은
# 중앙값 38분, 최대 108분이었다(실측 78회). 10분 안팎으로 돈 적은 한 번도 없다.
# GitHub 의 schedule 은 러너가 붐비면 늦추거나 건너뛴다.
#
# 그 간격이면 20~30분짜리 장애가 통째로 안 잡힌다. 그래서 측정은 러너 안의
# 루프(scripts/watch.mjs)가 1분마다 하고, 이 cron 은 그 루프가 끊겼을 때
# 다시 살리는 역할만 한다. 자주 걸어 둘수록 빈 시간이 짧아진다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '루프를 돌 시간(분). 0 이면 한 번만 재고 끝낸다.'
        required: false
        default: '50'

permissions:
  contents: write           # state.json · incidents.json 커밋

# 루프가 도는 동안 새로 걸린 예약 실행은 대기시킨다. 취소하지는 않는다 —
# 지금 도는 루프가 끝나는 순간 대기하던 것이 바로 이어받아서 빈 시간이 안 생긴다.
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # 루프가 50분이라 여유를 조금 둔다. GitHub 의 작업 하나는 최대 6시간이다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 커밋 신원
        run: |
          git config user.name  "egg-status bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 측정 루프
        env:
          # 예약 실행일 때는 inputs 가 비어 있어 기본값이 쓰인다.
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
        run: node scripts/watch.mjs
